# Runs tests, typecheck and build on every PR to main and every push to main. Pushes to main on this repo then build
# one image (ghcr.io, tagged vx.y.z-alpha.N), deploy it to the canary (the app in fly.toml), tag the GitHub
# pre-release, and deploy the same image to every shop app in the FLY_SHOP_APPS repo variable. PRs from forks get no
# secrets. See DEPLOY.md, "Versions and releases" and "Hosting a shop".

name: Fly Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Push runs queue (never cancel), so two merges can't take the same tag and deploys never overlap.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Build image
    needs: check
    # Only pushes to main on this repo deploy; PRs and forks just run the checks.
    if: github.event_name == 'push' && github.repository == 'garciaryan/mint-condition'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag that claims this run's number
      packages: write # push to ghcr.io
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.version.outputs.image }}
      shops: ${{ steps.shops.outputs.shops }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to number this deploy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        run: |
          tag=$(node --experimental-strip-types --no-warnings scripts/next-version.ts)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/garciaryan/mint-condition:$tag" >> "$GITHUB_OUTPUT"
      # Checked before anything deploys: a typo in the variable stops the run here.
      # Assigned first: inside echo's arguments, the script's exit status would be lost.
      - id: shops
        run: |
          shops=$(node --experimental-strip-types --no-warnings scripts/shop-apps.ts)
          echo "shops=$shops" >> "$GITHUB_OUTPUT"
        env:
          FLY_SHOP_APPS: ${{ vars.FLY_SHOP_APPS }}
      # Claim the number before building: the tag exists from here on, so no later run computes it again and no
      # image tag is ever overwritten. A run that fails after this leaves a bare tag (built, never released).
      - name: Claim the tag
        run: |
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
        env:
          tag: ${{ steps.version.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.image }}
          build-args: APP_VERSION=${{ steps.version.outputs.tag }}
          provenance: false # a plain image manifest; Fly's pull doesn't need the attestation index

  canary:
    name: Deploy canary
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # flyctl waits for the /api/health check, so a broken image stops here, before any shop.
      - run: flyctl deploy --image ${{ needs.image.outputs.image }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  release:
    name: Tag the release
    needs: [image, canary] # image for the tag; canary so it only runs once the canary is live
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release
    steps:
      # The image job pushed the tag; the release on it means "this image is live on the canary".
      - run: gh release create "$TAG" --title "$TAG" --prerelease --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.image.outputs.tag }}

  shops:
    name: Deploy ${{ matrix.shop.app }}
    needs: [image, canary]
    if: needs.image.outputs.shops != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one shop failing doesn't stop the others
      matrix:
        shop: ${{ fromJSON(needs.image.outputs.shops) }}
    env:
      FLY_API_TOKEN: ${{ secrets[matrix.shop.token] }}
    steps:
      - name: Check the deploy token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Secret ${{ matrix.shop.token }} for ${{ matrix.shop.app }} isn't set (DEPLOY.md, Hosting a shop)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --image ${{ needs.image.outputs.image }} -a ${{ matrix.shop.app }}
