# Runs tests, typecheck and build on every PR to main and every push to main; deploys to Fly.io only on pushes to
# main. PRs from forks get no secrets.
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Deploy app
    needs: check
    # Only pushes to main on this repo deploy; PRs and forks just run the checks.
    if: github.event_name == 'push' && github.repository == 'garciaryan/mint-condition'
    runs-on: ubuntu-latest
    concurrency: deploy-group # one deploy at a time; the app runs a single machine
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
