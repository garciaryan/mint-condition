# Deploys the staging app (mint-condition-staging) on every push to the `staging` branch,
# after tests, typecheck and build pass. Production deploys live in fly-deploy.yml.
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy (staging)
on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Deploy staging app
    needs: check
    runs-on: ubuntu-latest
    concurrency: deploy-staging # one deploy at a time; the staging app runs a single machine
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -c fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
